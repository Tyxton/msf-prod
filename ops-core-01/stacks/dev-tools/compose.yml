services:
  gitea:
    image: docker.gitea.com/gitea:latest
    container_name: devops-gitea
    environment:
      - USER_UID=${GITEA_UID}
      - USER_GID=${GITEA_GID}
    restart: unless-stopped
    volumes:
      - ${GITEA_MNT}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2922:22"
    networks:
      - npm-lan

networks:
  npm-lan:
    external: true
    name: npm-lan
