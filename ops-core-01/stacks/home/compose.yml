services:
  homepage:
    container_name: home-homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.local.nottyxton.net
    ports:
      - '3080:3000'
    volumes:
      - ${DOCKER_DIR}/homepage/config:/app/config
      - ${DOCKER_DIR}/homepage/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    container_name: home-actual_server
    ports:
      - '5006:5006'
    networks:
      - npm-lan
    volumes:
      - ${ACTUAL_MNT}:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  homeassistant:
    container_name: home-hass
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ${DOCKER_DIR}/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      TZ: ${TZ:-America/Chicago}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm-lan:
    external: true
    name: npm-lan
