services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: monitoring-kuma
    restart: unless-stopped
    volumes:
      - ${DOCKER_DIR}/uptimekuma:/app/data
    ports:
      - "3001:3001"
    networks:
      - proxy-core

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    user: "0:0"
    privileged: true
    networks:
      - itim-core
      - proxy-core
    ports:
      - "12345:12345"
      - "1514:1514/udp"
      - "1514:1514/tcp"
    volumes:
      # Config
      - ${DOCKER_DIR}/alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Docker & Container Management
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro

      # System Logging & Identity
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

      # Host Metrics, Storage, & Cgroups
      - /:/host:ro
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

  loki:
    image: grafana/loki:latest
    container_name: monitoring-loki
    restart: unless-stopped
    user: "0:0"
    networks:
      - itim-core
      - proxy-core
    ports:
      - "3100:3100"
    volumes:
      - ${DOCKER_DIR}/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ${LOKI_MNT}:/loki
    command: -config.file=/etc/loki/loki.yaml
    depends_on:
      alloy:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    networks:
      - itim-core
      - proxy-core
    volumes:
      - ${DOCKER_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROM_MNT}:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    user: "0"
    networks:
      - itim-core
      - proxy-core
    ports:
      - "9080:3000"
    volumes:
      - ${DOCKER_DIR}/grafana_data:/var/lib/grafana
    environment:
      - GF_RENDERING_SERVER_URL=http://monitoring-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://monitoring-grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
      - GF_RENDERING_RENDERER_TOKEN=${RENDER_TOKEN}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      alloy:
        condition: service_started

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: monitoring-renderer
    restart: unless-stopped
    networks:
      - itim-core
    ports:
      - "8081:8081"
    environment:
      - RENDERING_ARGS=--no-sandbox,--disable-gpu,--disable-dev-shm-usage
      - CONCURRENCY=1
      - GOMEMLIMIT=1GiB
      - AUTH_TOKEN=${RENDER_TOKEN}
      - BROWSER_MAX_HEIGHT=-1

  graphite-exporter:
    image: prom/graphite-exporter:latest
    container_name: monitoring-graphite
    restart: unless-stopped
    ports:
      - "2003:2003/tcp"
      - "2003:2003/udp"
      - "9108:9108"
    networks:
      - itim-core
      - proxy-core
    volumes:
      - ${DOCKER_DIR}/graphite/graphite_mapping.conf:/etc/graphite-exporter/graphite_mapping.conf
    command:
      - "--graphite.mapping-config=/etc/graphite-exporter/graphite_mapping.conf"
      - "--graphite.listen-address=:2003"
      - "--web.listen-address=:9108"

  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: monitoring-unpoller
    restart: unless-stopped
    networks:
      - itim-core
      - proxy-core
    environment:
      - UP_UNIFI_DEFAULT_URL=${GW_URL}
      - UP_UNIFI_DEFAULT_USER=${UNIFI_USER}
      - UP_UNIFI_DEFAULT_PASS=${UNIFI_PASS}
      - UP_UNIFI_DEFAULT_VERIFY_SSL=false
      - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9130
      - UP_INFLUXDB_DISABLE=true
    ports:
      - "9130:9130"

networks:
  itim-core:
    driver: bridge
  proxy-core:
    external: true
    name: proxy-core
