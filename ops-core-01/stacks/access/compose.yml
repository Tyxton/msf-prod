services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=true
      - DOMAIN=${DOMAIN}
    volumes:
      - ${DOCKER_DIR}/vaultwarden/vw-data:/data
    ports:
      - "9445:80"
    networks:
      - npm-lan

networks:
  npm-lan:
    external: true
    driver: bridge
