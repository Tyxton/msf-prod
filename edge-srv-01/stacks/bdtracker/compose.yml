services:
  bdtracker:
    image: bdtracker:latest
    container_name: bdtracker
    restart: unless-stopped
    networks:
      - proxy-edge
    ports:
      - "8000:8000"
    volumes:
      - ${BDTRACKER_MNT}:/data
    environment:
      - BD_DB_PATH=/data/bdtracker.db
      - BD_ALLOWED_HOSTS=${BD_ALLOWED_HOSTS}
      - BD_ALLOWED_ORIGINS=${BD_ALLOWED_ORIGINS}
      - BD_ADMIN_MASTER_KEY=${MASTER_KEY}

networks:
  proxy-edge:
    external: true
    name: proxy-edge
