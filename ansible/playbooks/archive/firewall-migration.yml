- name: Migrate Firewall from UFW to nftables
  hosts: edge-srv-01
  become: true

  pre_tasks:
    - name: Disable UFW
      ansible.builtin.service:
        name: ufw
        state: stopped
        enabled: no
      ignore_errors: yes
    
    - name: Disable UFW (native binary)
      ansible.builtin.shell: sudo ufw --force disable
      register: ufw_result
      failed_when:
        - ufw_result.rc != 0
        - ufw_result.rc != 127
        - "'Could not find ufw' not in ufw_result.stderr"
      changed_when: false

  roles:
    - firewall-migration

  tasks:
    - name: Verify nftables syntax before switch
      ansible.builtin.command: /usr/sbin/nft -c -f /etc/nftables.conf
      register: nft_check
      changed_when: false

    - name: Assert config is valid
      ansible.builtin.assert:
        that: nft_check.rc == 0
        fail_msg: "NFTables configuration is invalid. Aborting migration..."

  handlers:
    - name: Reload nftables service
      ansible.builtin.service:
        name: nftables
        state: restarted
        enabled: yes

  post_tasks:
    - name: Verify nftables is active
      ansible.builtin.command: systemctl is-active nftables
      register: service_status
      changed_when: false

    - name: Report status
      ansible.builtin.debug:
        msg: "Firewall migrated successfully: {{ service_status.stdout }}"
