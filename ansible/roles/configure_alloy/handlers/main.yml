- name: Restart Alloy Container
  ansible.builtin.shell: |
    docker restart alloy
  become: true
  register: restart_alloy
  failed_when:
    - restart_alloy.rc != 0
    - "'No such container' not in restart_alloy.stderr"

- name: Restart Alloy Service
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
  become: true
