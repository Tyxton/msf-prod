stacks:
  - name: access
    features: []
    exclude_features: ['tz']
    env:
      ADMIN_TOKEN: "{{ vault_vaultwarden_admin_token }}"
      DOMAIN: "{{ vault_vaultwarden_domain }}"
  - name: home
    features: []
    env:
      ACTUAL_MNT: "{{ vault_actual_mnt }}"
  - name: infra
    features: []
    exclude_features: ['tz']
  - name: monitoring
    features: []
    exclude_features: ['tz']
    env:
      UNIFI_PASS: "{{ vault_unifi_pass }}"
      LOKI_MNT: "{{ vault_loki_mnt }}"
      PROM_MNT: "{{ vault_prom_mnt }}"
      UNIFI_USER: "{{ vault_unifi_user }}"
      GW_URL: "{{ vault_gw_url }}"
      RENDER_TOKEN: "{{ vault_render_token }}"
  - name: network
    features: []
    exclude_features: ['tz']
    env:
      CF_TOKEN: "{{ vault_cloudflare_core_token }}"
      BASIC_AUTH: "{{ vault_traefik_core_auth }}"
      CONTACT_EMAIL: "{{ vault_contact_email }}"
      
